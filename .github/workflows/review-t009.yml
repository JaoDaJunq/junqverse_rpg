name: T009 Independent Review

on:
  push:
    branches:
      - review/p0-T009

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0

      - name: Clean install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Existing tests
        run: npm run test

      - name: Independent damage/status tests
        run: npx vitest run tests/review-t009.test.ts

      - name: Sim boundaries
        shell: bash
        run: |
          ! grep -R -nE "Date\.now|Math\.random|setTimeout|setInterval|from ['\"]phaser['\"]|window\.|document\." packages/sim/src

      - name: Planning integrity
        run: npm run test:plan

      - name: Build
        run: npm run build
