name: T007 Independent Review

on:
  push:
    branches:
      - review/p0-T007

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0

      - name: Clean install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Existing tests
        run: npm run test

      - name: Independent local-session tests
        run: npx vitest run tests/review-t007.test.ts

      - name: Client must not own movement rules
        shell: bash
        run: |
          ! grep -R -nE "moveCircleForTick|moveCircleAlongSegment|movementDeltaPerTick" apps/client/src/scenes apps/client/src/presentation

      - name: Planning integrity
        run: npm run test:plan

      - name: Build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser interaction review
        run: npx playwright test tests/e2e/review-t007.spec.ts
